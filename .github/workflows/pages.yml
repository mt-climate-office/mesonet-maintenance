# Deploys the site to GitHub Pages with a live social card: the kit's
# og-preview workflow screenshots the live map into assets/og-card.jpg every
# 6 hours. The image is never committed. Pages source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  pages:
    uses: mt-climate-office/mco-web-style/.github/workflows/og-preview.yml@v1.4.0
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    with:
      url: https://mesonet.climate.umt.edu/maintenance/?net=hydromet&labels=on&theme=light
      image_url: https://mesonet.climate.umt.edu/maintenance/assets/og-card.jpg
      # Station labels draw from z6; an 1800 px viewport fits Montana above it.
      width: 1800
      height: 945
      scale: '1.3333333333'
      ready_selector: '#refresh-stamp'
      ready_text: '^Updated '
      fail_selector: '#data-banner'
      seen_keys: mco-maint-seen-intro
      settle_ms: 2000
